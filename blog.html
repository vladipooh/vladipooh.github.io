    <script>
        function renderBlogFeed(data) {
            const entries = (data.feed && data.feed.entry) || [];
            const container = document.getElementById('rss-feed');

            if (!entries.length) {
                container.innerHTML = '<p class="col-12">No posts found.</p>';
                return;
            }

            const stripHtml = html => {
                const div = document.createElement('div');
                div.innerHTML = html || '';
                return (div.textContent || '').trim();
            };
            const esc = s => String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));

            let html = '';
            entries.slice(0, 20).forEach(e => {
                const title = e.title.$t;
                const link = (e.link.find(l => l.rel === 'alternate') || {}).href || '#';
                const content = e.content ? e.content.$t : (e.summary ? e.summary.$t : '');
                const text = stripHtml(content);

                // thumbnail: Blogger thumbnail -> first <img> in content -> placeholder
                let thumb = e.media$thumbnail ? e.media$thumbnail.url : '';
                if (!thumb) {
                    const m = content.match(/<img[^>]+src=["']([^"']+)["']/i);
                    thumb = m ? m[1] : 'img/poohlogo.png';
                }
                thumb = thumb.replace(/\/s\d+(-c)?\//, '/s640-c/');

                html += `<div class="col-lg-4 mb-5">
                            <div class="position-relative mb-4">
                                <div class="thumbnail-wrapper">
                                    <img class="img-fluid rounded w-100" src="${thumb}" alt="${esc(title)} Thumbnail">
                                </div>
                            </div>
                            <h6 class="font-weight-bold text-primary"><a href="${link}" target="_blank" rel="noopener">${esc(title)}</a></h6>
                            <small>Published on: ${new Date(e.published.$t).toDateString()}</small><br>
                            <p>${esc(text.slice(0, 100))}...</p>
                            <a class="btn btn-sm btn-outline-primary py-2 mt-2" href="${link}" target="_blank" rel="noopener">Read More</a>
                        </div>`;
            });
            container.innerHTML = html;
        }

        (function loadBlogFeed() {
            const s = document.createElement('script');
            s.src = 'https://phviro.blogspot.com/feeds/posts/default?alt=json-in-script&max-results=20&callback=renderBlogFeed';
            s.onerror = () => {
                document.getElementById('rss-feed').innerHTML =
                    '<p class="col-12">Unable to load posts. <a href="https://phviro.blogspot.com/">Read on Blogger</a></p>';
            };
            document.body.appendChild(s);
        })();
    </script>
